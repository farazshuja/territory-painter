<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena tile concepts</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#081126;color:#f5f7ff;font:15px/1.4 system-ui,Segoe UI,sans-serif;background-image:radial-gradient(ellipse at 10% 0%,#153b67 0,transparent 42%),radial-gradient(ellipse at 100% 100%,#30245e 0,transparent 45%)}header{max-width:1160px;margin:0 auto 22px}h1{font-size:30px;margin:0 0 6px}header p{color:#abb9d4;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;max-width:1160px;margin:auto}.card{padding:18px;background:#101d37e8;border:1px solid #49618780;border-radius:18px;box-shadow:0 14px 38px #03091680}.label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#8fb8ed;font-weight:800}.card h2{font-size:19px;margin:5px 0 3px}.desc{color:#b5c2dc;font-size:13px;min-height:36px}.arena{position:relative;margin:14px auto 0;width:min(100%,440px);aspect-ratio:1.38;border-radius:15px;padding:12px;overflow:hidden}.a{background:linear-gradient(145deg,#132648,#0d1830);border:2px solid #6ebee7;box-shadow:0 0 0 4px #080f21,0 0 28px #16c4ed38,inset 0 2px #ffffff20}.b{background:linear-gradient(160deg,#f6d998,#af7842 72%,#704a38);border:3px solid #ffedbd;box-shadow:0 0 0 5px #4a302d,0 12px 24px #0008,inset 0 4px #fff8}.c{background:linear-gradient(135deg,#25295b,#191940);border:3px solid #ffc855;box-shadow:0 0 0 4px #10112d,0 0 34px #ff4a9c45}.tiles{display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(8,1fr);height:100%;gap:3px}.tile{position:relative;border-radius:4px;overflow:hidden}.a .tile{background:linear-gradient(145deg,#142748,#10203b);border:1px solid #345071}.a .blue{background:linear-gradient(145deg,#7deaff,#159ee6 68%,#0874bd);border:1px solid #b8f7ff;box-shadow:inset 0 2px #fff9,0 2px #075087}.a .purple{background:linear-gradient(145deg,#e3bcff,#9e64f3 68%,#7044ca);border:1px solid #f4dfff;box-shadow:inset 0 2px #fff9,0 2px #54339f}.b .tile{background:linear-gradient(145deg,#e1c18a,#c49c67);border:1px solid #edce98;box-shadow:inset 0 1px #fff5}.b .blue{background:linear-gradient(145deg,#86ecff,#209bd7 70%,#1770a7);border:1px solid #d4fbff;box-shadow:inset 0 3px #fff9,0 3px #835a39}.b .purple{background:linear-gradient(145deg,#f0c8ff,#a46aeb 70%,#7841b4);border:1px solid #fff0ff;box-shadow:inset 0 3px #fff9,0 3px #835a39}.c .tile{background:linear-gradient(145deg,#21224c,#171735);border:1px solid #414273;border-radius:3px}.c .blue{background:linear-gradient(145deg,#75f0ff,#15b5df 60%,#047cbb);border:2px solid #beffff;box-shadow:inset 0 3px #fff9,0 0 8px #32d5f5;transform:skew(-3deg)}.c .purple{background:linear-gradient(145deg,#edbaff,#b04de8 60%,#7336c1);border:2px solid #ffe0ff;box-shadow:inset 0 3px #fff9,0 0 8px #ce68ff;transform:skew(-3deg)}.tile.blue:after,.tile.purple:after{content:"";position:absolute;inset:2px 3px auto;height:22%;background:#ffffff66;border-radius:4px}.player{position:absolute;width:11%;aspect-ratio:1;border-radius:8px;z-index:3}.player.p1{left:76%;top:10%;background:linear-gradient(145deg,#e9fcff,#41d8ff 65%,#087ec1);border:3px solid white;box-shadow:0 0 0 3px #087eb9,0 0 18px #4ddfff;transform:rotate(-5deg)}.player.p2{left:15%;top:73%;background:linear-gradient(145deg,#fff1ff,#d29aff 60%,#8040d8);border:3px solid white;box-shadow:0 0 0 3px #8146cf,0 0 18px #c07aff;transform:rotate(5deg)}.eye{position:absolute;top:36%;width:3px;height:4px;border-radius:2px;background:#172142}.eye.one{left:30%}.eye.two{right:30%}.pickup{position:absolute;left:48%;top:44%;width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,#fff6b7,#ffd43b 55%,#ff922d);border:2px solid white;box-shadow:0 0 0 2px #d38326,0 0 18px #ffd43b;font-size:16px;text-align:center;line-height:24px}.a .pickup,.c .pickup{border-radius:50%}.callout{position:absolute;right:8px;top:8px;background:#080f20d9;border:1px solid #fff3;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;letter-spacing:.06em}.a .callout{color:#8bf0ff}.b .callout{color:#fff0b3}.c .callout{color:#ffda70}.legend{display:flex;justify-content:space-between;margin-top:11px;color:#b8c6df;font-size:11px}.swatch{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.foot{max-width:1160px;margin:22px auto 0;color:#91a5c8;font-size:12px}@media(max-width:500px){body{padding:18px}.card{padding:14px}}
</style></head><body><header><h1>Arena tile design concepts</h1><p>Three modern, family-friendly arcade directions for the Territory Painter board. This is a visual preview only.</p></header><main class="grid" id="concepts"></main><div class="foot">Direction references: glossy color, playful depth, rounded forms and high contrast. Original concepts, not Nintendo assets.</div><script>
const concepts=[['01 · NEON CANDY','Polished night arena','Deep indigo board with luminous candy-glass tiles, edge highlights and a cool cyan frame. Crisp and competitive.','a'],['02 · TOYBOX ISLAND','Soft 3D board','Warm tabletop, softly beveled tiles and juicy player colors. Most tactile and welcoming.','b'],['03 · PARTY ARCADE','Bold pop arena','Punchy jewel tones, graphic borders and energetic glow. Best for a lively couch-versus feel.','c']];const root=document.querySelector('#concepts');for(const [tag,title,desc,style] of concepts){const card=document.createElement('section');card.className='card';card.innerHTML=`<div class="label">${tag}</div><h2>${title}</h2><div class="desc">${desc}</div><div class="arena ${style}"><span class="callout">ARENA · 2P</span><div class="tiles"></div><div class="player p1"><i class="eye one"></i><i class="eye two"></i></div><div class="player p2"><i class="eye one"></i><i class="eye two"></i></div><div class="pickup">✦</div></div><div class="legend"><span><i class="swatch" style="background:#29c6ef"></i>Player 1</span><span><i class="swatch" style="background:#b46aee"></i>Player 2</span><span>✦ Power-up</span></div>`;const tiles=card.querySelector('.tiles');for(let y=0;y<8;y++)for(let x=0;x<13;x++){const t=document.createElement('i');let klass='tile';if((x<3&&y>4)||(x<5&&y===4))klass+=' purple';if((x>8&&y<3)||(x>6&&y===3&&x<10))klass+=' blue';t.className=klass;tiles.append(t)}root.append(card)}
</script></body></html>
